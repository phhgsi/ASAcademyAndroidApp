name: Build & Release Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.8)'
        required: false
        default: 'v1.8'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine Release Tag & Version
        id: release_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.8"
          fi

          # Ensure tag starts with 'v'
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v$TAG"
          fi

          # Strip leading 'v' for versionName (e.g. v1.4 -> 1.4)
          VERSION="${TAG#v}"

          # Compute integer versionCode (offset run_number by 10 to guarantee monotonic increase)
          CODE=$(( ${{ github.run_number }} + 10 ))

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "==> Target Tag: $TAG | VersionName: $VERSION | VersionCode: $CODE"

      - name: Build Android APK with Dynamic Version
        run: |
          ./gradlew assembleDebug -PappVersionName="${{ steps.release_version.outputs.version }}" -PappVersionCode="${{ steps.release_version.outputs.code }}" --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          TAG="${{ steps.release_version.outputs.tag }}"
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/ASAcademyApp-${TAG}.apk"
          echo "APK generated successfully as ASAcademyApp-${TAG}.apk:"
          ls -lh release-output/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ASAcademyApp-${{ steps.release_version.outputs.tag }}
          path: release-output/ASAcademyApp-${{ steps.release_version.outputs.tag }}.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: "A.S. Academy Mobile App ${{ steps.release_version.outputs.tag }}"
          body: |
            ## 📱 A.S. Academy School Portal & Mobile Photo Studio (${{ steps.release_version.outputs.tag }})

            Standalone Native Android App for school operations, fee collection, attendance, and bulk photography.

            ### ✨ What's New in ${{ steps.release_version.outputs.tag }}:
            - **🧠 Edge-Preserving Bilateral Background Denoising**: Smooths sensor noise in flat background regions, allowing JPEG DCT to encode backgrounds with near-zero bits while preserving 100% facial sharpness.
            - **✨ Micro-Contrast Facial Feature Sharpening**: Enhanced definition for eyes, eyelashes, hair strands, and uniform collar contours without noise amplification.
            - **🎨 2-Stage Cascaded Nyquist Area Downsampling**: Eliminates fabric moire patterns, color fringing, and aliasing when scaling from large camera sensors to 900x1200.
            - **⚡ Rate-Distortion Bisection Optimization**: Binary-convergent rate-distortion search finding maximum perceptual quality (90–94%) within the optimal ~140KB–160KB budget.
            - **🖨️ Razor-Sharp 300 DPI Print Clarity**: Flawless physical prints for PVC ID cards, admission forms, admit cards, and marksheets.
            - **🔒 Strict Single-Class Locking**: Locks to a single class persistently without resets or dumps.
            - **💎 Kyant0 Liquid Glass UI**: Sleek continuous squircles, glowing neon cyan `#38BDF8` accents, and pill capsules.
            - **🔄 In-App Auto Update**: Automatically checks GitHub Releases and installs in 1 tap.

            ### 📲 Installation:
            1. Download `ASAcademyApp-${{ steps.release_version.outputs.tag }}.apk` below.
            2. Open on any Android phone (Android 5.0 to 14+) and tap **Install**.
          files: |
            release-output/ASAcademyApp-${{ steps.release_version.outputs.tag }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
