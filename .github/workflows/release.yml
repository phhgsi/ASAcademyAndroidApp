name: Build & Release Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.2)'
        required: false
        default: 'v1.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/ASAcademyApp-v1.2.apk
          echo "APK generated successfully:"
          ls -lh release-output/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ASAcademyApp-v1.2
          path: release-output/ASAcademyApp-v1.2.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.2"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "A.S. Academy Mobile App ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## 📱 A.S. Academy School Portal & Mobile Photo Studio

            Standalone Native Android App for school operations, fee collection, attendance, and bulk photography.

            ### ✨ Key Features & Improvements:
            - **📸 Rapid Photo Desk**: Bulk photography studio mode with live capture progress (`X / Total Captured`) and instant Google ML Kit AI face framing.
            - **✨ AI-Framed Photo Updates**: Safe native camera shutter + phone gallery / file picker with 3:4 passport auto-cropping, edge sharpening, and adaptive compression (<75KB).
            - **🪪 Digital Student Identity Card**: Kyant0 continuous squircle portrait framing with dynamic on-device QR code verification and 1-tap share.
            - **💬 Parent Quick Actions**: Direct WhatsApp message trigger and 1-tap phone dialer.
            - **🏛️ Permanent Register / Archive Photo Management**: Capture, optimize, and update photos for past/archived students.
            - **🎨 Kyant0 Compose UI**: Modern Material 3 Expressive UI tokens with Capsule & Shapes (`io.github.kyant0:capsule:2.1.3`).
            - **🌐 Dynamic Server URL Connection**: Connect over local Wi-Fi LAN or Cloudflare Live Tunnel with QR code scanner.

            ### 📲 Installation:
            1. Download `ASAcademyApp-v1.2.apk` below.
            2. Open on any Android phone (Android 5.0 to 14+) and tap **Install**.
          files: |
            release-output/ASAcademyApp-v1.2.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
